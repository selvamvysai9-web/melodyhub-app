name: melody_hub
description: "A next-gen Aurora Glassmorphism music streaming app."
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  just_audio: ^0.9.42
  google_sign_in: ^6.2.2
  http: ^1.2.2
  cached_network_image: ^3.4.1
  path_provider: ^2.1.5
  youtube_player_flutter: ^9.1.3
  shared_preferences: ^2.5.3
  share_plus: ^11.1.0
  audio_service: ^0.18.15
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  palette_generator: ^0.3.3+5
  flutter_dotenv: ^5.1.0
  youtube_explode_dart: ^3.1.0
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo.jpg"

flutter:
  uses-material-design: true
  assets:
    - assets/logo.jpg